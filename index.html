<!DOCTYPE html><html lang="ja"><head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>クラウドサービス AWS・Azure・GCP 比較フラッシュカード</title>  <script src="https://cdn.tailwindcss.com"></script>  <style>    .card-container { perspective: 800px; }    .card-inner { transition: transform 0.5s; transform-style: preserve-3d; }    .card-inner.flipped { transform: rotateY(180deg); }    .card-front, .card-back { backface-visibility: hidden; -webkit-backface-visibility: hidden; }    .card-back { transform: rotateY(180deg); }    .badge-aws   { background: #FF9900; color: #000; }    .badge-azure { background: #0078D4; color: #fff; }    .badge-gcp   { background: #4285F4; color: #fff; }  </style></head><body class="bg-sky-50 min-h-screen">  <div class="max-w-2xl mx-auto px-4 py-6">    <header class="text-center mb-6">      <h1 class="text-2xl font-bold text-sky-900">クラウド比較 フラッシュカード</h1>      <p class="text-sm text-sky-600 mt-1">AWS / Azure / GCP サービス対応表学習</p>    </header>    <!-- Tab Nav -->    <div class="flex gap-1 mb-6 bg-sky-100 p-1 rounded-xl" role="tablist" aria-label="メインタブ">      <button id="tab-study" role="tab" aria-selected="true" aria-controls="panel-study"        class="flex-1 py-2 px-3 rounded-lg text-sm font-medium transition-colors bg-white text-sky-900 shadow"        onclick="switchTab('study')">学習</button>      <button id="tab-browse" role="tab" aria-selected="false" aria-controls="panel-browse"        class="flex-1 py-2 px-3 rounded-lg text-sm font-medium transition-colors text-sky-700 hover:bg-sky-200"        onclick="switchTab('browse')">カード一覧</button>      <button id="tab-stats" role="tab" aria-selected="false" aria-controls="panel-stats"        class="flex-1 py-2 px-3 rounded-lg text-sm font-medium transition-colors text-sky-700 hover:bg-sky-200"        onclick="switchTab('stats')">統計</button>    </div>    <!-- Study Panel -->    <div id="panel-study" role="tabpanel" aria-labelledby="tab-study">      <!-- Filter by category -->      <div class="bg-white rounded-xl shadow p-3 mb-4">        <div class="flex flex-wrap gap-2 items-center">          <span class="text-xs font-medium text-gray-600">カテゴリ:</span>          <button id="cat-btn-all" onclick="setCategory('all')"            class="px-2 py-1 rounded text-xs bg-sky-600 text-white focus:outline-none focus:ring-2 focus:ring-sky-400">すべて</button>          <div id="cat-buttons" class="flex flex-wrap gap-1"></div>        </div>      </div>      <!-- Mode selector -->      <div class="bg-white rounded-xl shadow p-3 mb-4">        <div class="flex gap-3 items-center">          <span class="text-xs font-medium text-gray-600">モード:</span>          <label class="flex items-center gap-1 text-xs cursor-pointer">            <input type="radio" name="mode" value="service-to-equiv" checked onchange="setMode(this.value)"              class="focus:ring-sky-400">            サービス名 → 対応サービス          </label>          <label class="flex items-center gap-1 text-xs cursor-pointer">            <input type="radio" name="mode" value="spaced" onchange="setMode(this.value)"              class="focus:ring-sky-400">            復習優先 (間隔反復)          </label>        </div>      </div>      <!-- Progress -->      <div class="bg-white rounded-xl shadow px-4 py-2 mb-4 flex items-center justify-between">        <span class="text-sm text-gray-500">残り: <span id="remaining-count" class="font-bold text-sky-700" aria-live="polite">-</span> 枚</span>        <div class="w-40 bg-gray-200 rounded-full h-2" role="progressbar"          aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" id="progress-bar-wrap">          <div id="study-progress-bar" class="bg-sky-500 h-2 rounded-full transition-all" style="width:0%"></div>        </div>        <span id="session-score" class="text-sm text-gray-500" aria-live="polite">0 / 0</span>      </div>      <!-- Flash Card -->      <div class="card-container mb-4">        <div id="flash-card" class="card-inner cursor-pointer select-none" onclick="flipCard()" role="button"          aria-label="カードをクリックして答えを確認" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' ')flipCard()">          <!-- Front -->          <div class="card-front bg-white rounded-xl shadow-lg p-6 min-h-[220px] flex flex-col justify-between">            <div class="flex items-start justify-between mb-2">              <span id="card-category" class="text-xs font-bold text-sky-600 uppercase tracking-wide"></span>              <span id="card-cloud-badge" class="px-2 py-0.5 rounded text-xs font-bold badge-aws"></span>            </div>            <div class="flex-1 flex flex-col items-center justify-center text-center">              <div id="card-question-label" class="text-xs text-gray-400 mb-2">このサービスの AWS / Azure / GCP 対応は？</div>              <div id="card-service-name" class="text-3xl font-bold text-gray-800 mb-2"></div>              <div id="card-service-desc" class="text-sm text-gray-500"></div>            </div>            <div class="text-center text-xs text-gray-300 mt-2">クリック / Enter でフリップ</div>          </div>          <!-- Back -->          <div class="card-back absolute inset-0 bg-sky-700 text-white rounded-xl shadow-lg p-6 min-h-[220px] flex flex-col justify-center" aria-label="答え面">            <div class="text-xs font-bold text-sky-200 mb-3 uppercase" id="back-category"></div>            <div class="space-y-3">              <div class="flex items-center gap-3">                <span class="badge-aws px-2 py-0.5 rounded text-xs font-bold flex-shrink-0">AWS</span>                <span id="ans-aws" class="font-bold text-lg"></span>              </div>              <div class="flex items-center gap-3">                <span class="badge-azure px-2 py-0.5 rounded text-xs font-bold flex-shrink-0">Azure</span>                <span id="ans-azure" class="font-bold text-lg"></span>              </div>              <div class="flex items-center gap-3">                <span class="badge-gcp px-2 py-0.5 rounded text-xs font-bold flex-shrink-0">GCP</span>                <span id="ans-gcp" class="font-bold text-lg"></span>              </div>            </div>            <div id="ans-note" class="text-xs text-sky-200 mt-3 italic"></div>          </div>        </div>      </div>      <!-- Action Buttons (shown after flip) -->      <div id="answer-buttons" class="hidden flex gap-3 justify-center">        <button onclick="markCard(false)" aria-label="不正解・もう一度"          class="flex-1 max-w-[160px] py-3 bg-red-500 text-white rounded-xl font-bold hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-400 transition-colors">          もう一度        </button>        <button onclick="markCard(true)" aria-label="正解"          class="flex-1 max-w-[160px] py-3 bg-green-500 text-white rounded-xl font-bold hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-green-400 transition-colors">          正解！        </button>      </div>      <div id="next-button" class="flex justify-center">        <button onclick="nextCard()" aria-label="次のカード"          class="px-8 py-3 bg-sky-500 text-white rounded-xl font-bold hover:bg-sky-600 focus:outline-none focus:ring-2 focus:ring-sky-400 transition-colors">          次のカード →        </button>      </div>      <!-- Session complete -->      <div id="session-complete" class="hidden text-center bg-white rounded-xl shadow p-6">        <div class="text-4xl mb-2">🎉</div>        <div class="text-xl font-bold text-gray-800 mb-1">セッション完了！</div>        <div id="session-result" class="text-gray-500 mb-4"></div>        <button onclick="restartSession()"          class="px-6 py-3 bg-sky-600 text-white rounded-xl font-bold hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-sky-400">          もう一度        </button>      </div>    </div>    <!-- Browse Panel -->    <div id="panel-browse" role="tabpanel" aria-labelledby="tab-browse" class="hidden">      <div class="bg-white rounded-xl shadow p-4">        <h2 class="font-bold text-gray-800 mb-3">カード一覧 (<span id="total-count"></span>枚)</h2>        <div id="browse-list" class="space-y-2 overflow-y-auto max-h-[60vh]" aria-label="フラッシュカード一覧"></div>      </div>    </div>    <!-- Stats Panel -->    <div id="panel-stats" role="tabpanel" aria-labelledby="tab-stats" class="hidden">      <div class="bg-white rounded-xl shadow p-4 mb-4">        <div class="flex justify-between items-center mb-4">          <h2 class="font-bold text-gray-800">学習統計</h2>          <button onclick="clearStats()"            class="text-xs text-red-500 hover:text-red-700 focus:outline-none focus:ring-2 focus:ring-red-300 rounded px-2 py-1">リセット</button>        </div>        <div class="grid grid-cols-2 gap-3 mb-4">          <div class="bg-sky-50 rounded-lg p-3 text-center">            <div id="stat-total-answered" class="text-2xl font-bold text-sky-700">0</div>            <div class="text-xs text-gray-500">総回答数</div>          </div>          <div class="bg-green-50 rounded-lg p-3 text-center">            <div id="stat-accuracy" class="text-2xl font-bold text-green-700">-</div>            <div class="text-xs text-gray-500">正解率</div>          </div>        </div>        <h3 class="text-sm font-bold text-gray-700 mb-2">カテゴリ別正解率</h3>        <div id="stats-by-cat" class="space-y-2"></div>        <h3 class="text-sm font-bold text-gray-700 mt-4 mb-2">要復習カード (正解率 &lt; 70%)</h3>        <div id="weak-cards" class="space-y-1 text-sm"></div>      </div>    </div>  </div>  <script>    // ===== Card Data =====    const CARDS = [      // Compute      { id:'c1', cat:'Compute', aws:'EC2', azure:'Virtual Machines', gcp:'Compute Engine', desc:'仮想マシン (VM) サービス', note:'IaaS の基盤' },      { id:'c2', cat:'Compute', aws:'Lambda', azure:'Azure Functions', gcp:'Cloud Functions / Cloud Run', desc:'サーバーレス関数実行', note:'FaaS' },      { id:'c3', cat:'Compute', aws:'ECS / EKS', azure:'AKS', gcp:'GKE', desc:'コンテナオーケストレーション', note:'Kubernetes マネージドサービス' },      { id:'c4', cat:'Compute', aws:'Elastic Beanstalk', azure:'App Service', gcp:'App Engine', desc:'PaaS アプリホスティング', note:'コードを渡すだけでインフラ管理' },      { id:'c5', cat:'Compute', aws:'Lightsail', azure:'Azure Virtual Machines (Basic)', gcp:'Compute Engine (小型)', desc:'シンプルな VPS', note:'小規模ワークロード向け' },      // Storage      { id:'s1', cat:'Storage', aws:'S3', azure:'Blob Storage', gcp:'Cloud Storage', desc:'オブジェクトストレージ', note:'非構造化データの保存' },      { id:'s2', cat:'Storage', aws:'EBS', azure:'Azure Managed Disks', gcp:'Persistent Disk', desc:'ブロックストレージ', note:'VM 接続用ディスク' },      { id:'s3', cat:'Storage', aws:'EFS', azure:'Azure Files', gcp:'Filestore', desc:'ファイルストレージ (NFS)', note:'共有ファイルシステム' },      { id:'s4', cat:'Storage', aws:'Glacier', azure:'Archive Storage', gcp:'Cloud Storage Archive', desc:'長期アーカイブストレージ', note:'低コスト・低頻度アクセス' },      // Database      { id:'d1', cat:'Database', aws:'RDS', azure:'Azure SQL Database', gcp:'Cloud SQL', desc:'リレーショナル DB マネージド', note:'MySQL / PostgreSQL 等' },      { id:'d2', cat:'Database', aws:'Aurora', azure:'Azure SQL Hyperscale', gcp:'AlloyDB / Spanner', desc:'高性能 RDBMS', note:'水平スケール対応 RDBMS' },      { id:'d3', cat:'Database', aws:'DynamoDB', azure:'Cosmos DB', gcp:'Firestore / Bigtable', desc:'フルマネージド NoSQL', note:'サーバーレス NoSQL' },      { id:'d4', cat:'Database', aws:'ElastiCache', azure:'Azure Cache for Redis', gcp:'Memorystore', desc:'インメモリキャッシュ', note:'Redis / Memcached' },      { id:'d5', cat:'Database', aws:'Redshift', azure:'Azure Synapse Analytics', gcp:'BigQuery', desc:'データウェアハウス', note:'大規模 OLAP クエリ' },      // Network / CDN      { id:'n1', cat:'Networking', aws:'VPC', azure:'Virtual Network (VNet)', gcp:'VPC', desc:'仮想プライベートネットワーク', note:'ネットワーク分離の基盤' },      { id:'n2', cat:'Networking', aws:'CloudFront', azure:'Azure CDN / Front Door', gcp:'Cloud CDN', desc:'CDN コンテンツ配信', note:'エッジキャッシュ配信' },      { id:'n3', cat:'Networking', aws:'Route 53', azure:'Azure DNS', gcp:'Cloud DNS', desc:'DNS サービス', note:'ドメイン名解決' },      { id:'n4', cat:'Networking', aws:'ELB / ALB', azure:'Azure Load Balancer / App Gateway', gcp:'Cloud Load Balancing', desc:'ロードバランサー', note:'L4/L7 負荷分散' },      { id:'n5', cat:'Networking', aws:'Direct Connect', azure:'ExpressRoute', gcp:'Cloud Interconnect', desc:'専用線接続', note:'オンプレミス↔クラウド専用線' },      // AI/ML      { id:'m1', cat:'AI / ML', aws:'SageMaker', azure:'Azure Machine Learning', gcp:'Vertex AI', desc:'ML モデルトレーニング & デプロイ', note:'フルマネージド MLOps' },      { id:'m2', cat:'AI / ML', aws:'Rekognition', azure:'Computer Vision', gcp:'Vision AI', desc:'画像認識 AI API', note:'オブジェクト検出・顔認識' },      { id:'m3', cat:'AI / ML', aws:'Polly / Transcribe', azure:'Azure Speech', gcp:'Text-to-Speech / Speech-to-Text', desc:'音声合成・認識', note:'TTS / STT' },      // Messaging      { id:'q1', cat:'Messaging', aws:'SQS', azure:'Azure Queue Storage / Service Bus', gcp:'Cloud Pub/Sub', desc:'メッセージキュー', note:'非同期メッセージング' },      { id:'q2', cat:'Messaging', aws:'SNS', azure:'Azure Notification Hubs / Event Grid', gcp:'Cloud Pub/Sub', desc:'プッシュ通知 / イベント配信', note:'Pub/Sub パターン' },      { id:'q3', cat:'Messaging', aws:'Kinesis', azure:'Azure Event Hubs', gcp:'Cloud Dataflow / Pub/Sub', desc:'ストリームデータ処理', note:'リアルタイムデータパイプライン' },      // IAM / Security      { id:'i1', cat:'Security', aws:'IAM', azure:'Azure Active Directory / Entra ID', gcp:'Cloud IAM', desc:'ID & アクセス管理', note:'認証・認可の基盤' },      { id:'i2', cat:'Security', aws:'KMS', azure:'Azure Key Vault', gcp:'Cloud KMS', desc:'暗号鍵管理サービス', note:'シークレット・証明書管理' },      { id:'i3', cat:'Security', aws:'WAF', azure:'Azure WAF', gcp:'Cloud Armor', desc:'Web アプリケーションファイアウォール', note:'DDoS / SQL インジェクション対策' },      // DevOps / CI/CD      { id:'v1', cat:'DevOps', aws:'CodePipeline / CodeBuild', azure:'Azure DevOps / GitHub Actions', gcp:'Cloud Build / Cloud Deploy', desc:'CI/CD パイプライン', note:'ビルド・テスト・デプロイ自動化' },      { id:'v2', cat:'DevOps', aws:'CloudFormation', azure:'ARM Templates / Bicep', gcp:'Deployment Manager / Terraform', desc:'Infrastructure as Code', note:'インフラのコード化' },      { id:'v3', cat:'DevOps', aws:'CloudWatch', azure:'Azure Monitor', gcp:'Cloud Monitoring / Cloud Logging', desc:'監視・ロギング・アラート', note:'オブザーバビリティ基盤' },      // Serverless / Edge      { id:'e1', cat:'Serverless', aws:'API Gateway', azure:'Azure API Management', gcp:'Cloud Endpoints / API Gateway', desc:'API ゲートウェイ', note:'REST / WebSocket エンドポイント管理' },      { id:'e2', cat:'Serverless', aws:'Step Functions', azure:'Azure Logic Apps / Durable Functions', gcp:'Workflows', desc:'ワークフローオーケストレーション', note:'状態機械ベースのサービス連携' },      { id:'e3', cat:'Serverless', aws:'EventBridge', azure:'Azure Event Grid', gcp:'Eventarc', desc:'イベントドリブンアーキテクチャ', note:'イベントルーティング基盤' },      // Analytics      { id:'a1', cat:'Analytics', aws:'Athena', azure:'Azure Data Lake Analytics', gcp:'BigQuery', desc:'サーバーレス クエリサービス', note:'S3/GCS 上の SQL クエリ' },      { id:'a2', cat:'Analytics', aws:'Glue', azure:'Azure Data Factory', gcp:'Cloud Dataflow / Dataproc', desc:'ETL / データ統合', note:'データパイプライン構築' },      { id:'a3', cat:'Analytics', aws:'QuickSight', azure:'Power BI', gcp:'Looker / Looker Studio', desc:'BI / データ可視化', note:'ダッシュボード作成ツール' },      // Containers/Registry      { id:'r1', cat:'Registry', aws:'ECR', azure:'Azure Container Registry', gcp:'Artifact Registry', desc:'コンテナイメージレジストリ', note:'Docker イメージの保存・管理' },      { id:'r2', cat:'Registry', aws:'ECS Fargate', azure:'Azure Container Instances', gcp:'Cloud Run', desc:'サーバーレスコンテナ実行', note:'クラスタ管理不要のコンテナ実行' },    ];    const CATEGORIES = [...new Set(CARDS.map(c => c.cat))];    // ===== State =====    let progress = {}; // cardId -> { correct, incorrect, lastSeen }    let deck = [];    let deckIndex = 0;    let currentCard = null;    let isFlipped = false;    let sessionCorrect = 0;    let sessionTotal = 0;    let activeCategory = 'all';    let studyMode = 'service-to-equiv';    // ===== localStorage =====    function loadProgress() {      try { return JSON.parse(localStorage.getItem('cloudFlashProgress') || '{}'); } catch { return {}; }    }    function saveProgress() { localStorage.setItem('cloudFlashProgress', JSON.stringify(progress)); }    // ===== Tab =====    function switchTab(tab) {      ['study','browse','stats'].forEach(t => {        document.getElementById('panel-' + t).classList.toggle('hidden', t !== tab);        const btn = document.getElementById('tab-' + t);        btn.setAttribute('aria-selected', t === tab ? 'true' : 'false');        if (t === tab) {          btn.classList.add('bg-white','text-sky-900','shadow');          btn.classList.remove('text-sky-700','hover:bg-sky-200');        } else {          btn.classList.remove('bg-white','text-sky-900','shadow');          btn.classList.add('text-sky-700','hover:bg-sky-200');        }      });      if (tab === 'browse') renderBrowse();      if (tab === 'stats') renderStats();    }    // ===== Category buttons =====    function renderCatButtons() {      const container = document.getElementById('cat-buttons');      container.innerHTML = '';  // xss-ok: reviewed-internal-data      CATEGORIES.forEach(cat => {        const btn = document.createElement('button');        btn.textContent = cat;        btn.className = 'px-2 py-1 rounded text-xs bg-gray-100 text-gray-700 hover:bg-sky-100 focus:outline-none focus:ring-2 focus:ring-sky-400';        btn.onclick = () => setCategory(cat);        btn.id = 'cat-btn-' + cat;        container.appendChild(btn);      });    }    function setCategory(cat) {      activeCategory = cat;      document.getElementById('cat-btn-all').className =        cat === 'all'          ? 'px-2 py-1 rounded text-xs bg-sky-600 text-white focus:outline-none focus:ring-2 focus:ring-sky-400'          : 'px-2 py-1 rounded text-xs bg-gray-100 text-gray-700 hover:bg-sky-100 focus:outline-none focus:ring-2 focus:ring-sky-400';      CATEGORIES.forEach(c => {        const b = document.getElementById('cat-btn-' + c);        if (b) b.className = c === cat          ? 'px-2 py-1 rounded text-xs bg-sky-600 text-white focus:outline-none focus:ring-2 focus:ring-sky-400'          : 'px-2 py-1 rounded text-xs bg-gray-100 text-gray-700 hover:bg-sky-100 focus:outline-none focus:ring-2 focus:ring-sky-400';      });      buildDeck();      showCard();    }    function setMode(mode) {      studyMode = mode;      buildDeck();      showCard();    }    // ===== Deck building =====    function buildDeck() {      let filtered = activeCategory === 'all' ? [...CARDS] : CARDS.filter(c => c.cat === activeCategory);      if (studyMode === 'spaced') {        // Weight cards by error rate: more wrong = more repeats        const weighted = [];        filtered.forEach(card => {          const p = progress[card.id] || { correct: 0, incorrect: 0 };          const total = p.correct + p.incorrect;          const errorRate = total > 0 ? p.incorrect / total : 0.5;          const weight = Math.max(1, Math.round(1 + errorRate * 3));          for (let i = 0; i < weight; i++) weighted.push(card);        });        deck = shuffleArray(weighted);      } else {        deck = shuffleArray(filtered);      }      deckIndex = 0;      sessionCorrect = 0;      sessionTotal = 0;      updateProgress();    }    function shuffleArray(arr) {      const a = [...arr];      for (let i = a.length - 1; i > 0; i--) {        const j = Math.floor(Math.random() * (i + 1));        [a[i], a[j]] = [a[j], a[i]];      }      return a;    }    // ===== Card Display =====    function showCard() {      document.getElementById('session-complete').classList.add('hidden');      document.getElementById('flash-card').parentElement.classList.remove('hidden');      if (deckIndex >= deck.length) {        finishSession();        return;      }      currentCard = deck[deckIndex];      isFlipped = false;      document.getElementById('flash-card').classList.remove('flipped');      document.getElementById('answer-buttons').classList.add('hidden');      document.getElementById('next-button').classList.remove('hidden');      // Front      document.getElementById('card-category').textContent = currentCard.cat;      document.getElementById('card-service-name').textContent =        [currentCard.aws, currentCard.azure, currentCard.gcp][Math.floor(Math.random() * 3)];      document.getElementById('card-service-desc').textContent = currentCard.desc;      const clouds = ['AWS','Azure','GCP'];      const cloudColors = ['badge-aws','badge-azure','badge-gcp'];      const ci = Math.floor(Math.random() * 3);      const badge = document.getElementById('card-cloud-badge');      badge.textContent = clouds[ci];      badge.className = 'px-2 py-0.5 rounded text-xs font-bold ' + cloudColors[ci];      // Back      document.getElementById('back-category').textContent = currentCard.cat;      document.getElementById('ans-aws').textContent = currentCard.aws;      document.getElementById('ans-azure').textContent = currentCard.azure;      document.getElementById('ans-gcp').textContent = currentCard.gcp;      document.getElementById('ans-note').textContent = currentCard.note || '';      updateProgress();    }    function flipCard() {      if (isFlipped) return;      isFlipped = true;      document.getElementById('flash-card').classList.add('flipped');      document.getElementById('answer-buttons').classList.remove('hidden');      document.getElementById('next-button').classList.add('hidden');    }    function markCard(correct) {      if (!currentCard) return;      if (!progress[currentCard.id]) progress[currentCard.id] = { correct: 0, incorrect: 0 };      if (correct) {        progress[currentCard.id].correct++;        sessionCorrect++;      } else {        progress[currentCard.id].incorrect++;      }      progress[currentCard.id].lastSeen = Date.now();      sessionTotal++;      saveProgress();      deckIndex++;      showCard();    }    function nextCard() {      deckIndex++;      showCard();    }    function updateProgress() {      const remaining = deck.length - deckIndex;      document.getElementById('remaining-count').textContent = remaining;      const pct = deck.length > 0 ? Math.round((deckIndex / deck.length) * 100) : 0;      document.getElementById('study-progress-bar').style.width = pct + '%';      document.getElementById('progress-bar-wrap').setAttribute('aria-valuenow', pct);      document.getElementById('session-score').textContent = sessionCorrect + ' / ' + sessionTotal;    }    function finishSession() {      document.getElementById('flash-card').parentElement.classList.add('hidden');      document.getElementById('answer-buttons').classList.add('hidden');      document.getElementById('next-button').classList.add('hidden');      document.getElementById('session-complete').classList.remove('hidden');      const acc = sessionTotal > 0 ? Math.round((sessionCorrect / sessionTotal) * 100) : 0;      document.getElementById('session-result').textContent =        `正解 ${sessionCorrect} / ${sessionTotal} 枚 (${acc}%)`;    }    function restartSession() {      buildDeck();      showCard();    }    // ===== Browse =====    function renderBrowse() {      const container = document.getElementById('browse-list');      document.getElementById('total-count').textContent = CARDS.length;      container.innerHTML = '';  // xss-ok: reviewed-internal-data      let lastCat = '';      CARDS.forEach(card => {        if (card.cat !== lastCat) {          const hdr = document.createElement('div');          hdr.className = 'text-xs font-bold text-sky-600 uppercase tracking-wide pt-2 pb-1';          hdr.textContent = card.cat;          container.appendChild(hdr);          lastCat = card.cat;        }        const p = progress[card.id] || { correct: 0, incorrect: 0 };        const total = p.correct + p.incorrect;        const acc = total > 0 ? Math.round((p.correct / total) * 100) : null;        const div = document.createElement('div');        div.className = 'grid grid-cols-4 gap-1 items-center border-b border-gray-100 py-1 text-xs';        // xss-ok: reviewed-internal-data
        div.innerHTML = `
          <span class="font-medium text-gray-800 col-span-1 truncate">${escH(card.aws)}</span>          <span class="text-blue-600 truncate">${escH(card.azure)}</span>          <span class="text-green-600 truncate">${escH(card.gcp)}</span>          <span class="${acc === null ? 'text-gray-300' : acc >= 70 ? 'text-green-600' : 'text-red-500'} text-right">${acc !== null ? acc+'%' : '-'}</span>        `; // xss-ok: acc=computed value        container.appendChild(div);      });    }    // ===== Stats =====    function renderStats() {      const totalAnswered = Object.values(progress).reduce((s, p) => s + p.correct + p.incorrect, 0);      const totalCorrect = Object.values(progress).reduce((s, p) => s + p.correct, 0);      document.getElementById('stat-total-answered').textContent = totalAnswered;      document.getElementById('stat-accuracy').textContent =        totalAnswered > 0 ? Math.round((totalCorrect / totalAnswered) * 100) + '%' : '-';      // By category      const catContainer = document.getElementById('stats-by-cat');      catContainer.innerHTML = '';  // xss-ok: reviewed-internal-data      CATEGORIES.forEach(cat => {        const cards = CARDS.filter(c => c.cat === cat);        const totals = cards.map(c => progress[c.id] || { correct: 0, incorrect: 0 });        const totalAns = totals.reduce((s, p) => s + p.correct + p.incorrect, 0);        const totalCor = totals.reduce((s, p) => s + p.correct, 0);        const acc = totalAns > 0 ? Math.round((totalCor / totalAns) * 100) : null;        const div = document.createElement('div');        div.className = 'flex items-center gap-2';        // xss-ok: reviewed-internal-data
        div.innerHTML = `
          <span class="text-xs text-gray-600 w-24 flex-shrink-0">${escH(cat)}</span>          <div class="flex-1 bg-gray-200 rounded h-2">            <div class="bg-sky-500 h-2 rounded" style="width:${acc || 0}%"></div>          </div>          <span class="text-xs font-bold ${acc === null ? 'text-gray-300' : acc >= 70 ? 'text-green-600' : 'text-red-500'} w-10 text-right">${acc !== null ? acc+'%' : '-'}</span>        `; // xss-ok: acc=computed value        catContainer.appendChild(div);      });      // Weak cards      const weakContainer = document.getElementById('weak-cards');      weakContainer.innerHTML = '';  // xss-ok: reviewed-internal-data      const weakCards = CARDS.filter(c => {        const p = progress[c.id];        if (!p) return false;        const total = p.correct + p.incorrect;        return total > 0 && (p.correct / total) < 0.7;      }).sort((a, b) => {        const pa = progress[a.id], pb = progress[b.id];        return (pa.correct / (pa.correct + pa.incorrect)) - (pb.correct / (pb.correct + pb.incorrect));      });      if (weakCards.length === 0) {        weakContainer.innerHTML = '<p class="text-xs text-gray-400">要復習カードなし</p>';  // xss-ok: reviewed-internal-data      } else {        weakCards.slice(0, 10).forEach(c => {          const p = progress[c.id];          const acc = Math.round(p.correct / (p.correct + p.incorrect) * 100);          const div = document.createElement('div');          div.className = 'flex items-center justify-between py-1 border-b border-gray-100';          // xss-ok: reviewed-internal-data
          div.innerHTML = `
            <span class="text-gray-700">${escH(c.aws)} / ${escH(c.azure)} / ${escH(c.gcp)}</span>            <span class="text-red-500 font-bold">${acc}%</span>          `; // xss-ok: acc=computed value          weakContainer.appendChild(div);        });      }    }    function clearStats() {      if (!confirm('学習統計をリセットしますか？')) return;      progress = {};      saveProgress();      renderStats();    }    function escH(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }    // ===== Init =====    function init() {      progress = loadProgress();      renderCatButtons();      buildDeck();      showCard();    }    init();  </script></body></html>
